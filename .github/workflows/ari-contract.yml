name: ARI contract

on:
  push:
    branches: [main, master, v6, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          path: ari-proxy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: two-barrels/ari
          # Source evidence for the contract audit; builds resolve go.mod's tag.
          ref: v6.0.0-rc.1
          path: ari
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            ari/go.sum
            ari-proxy/go.sum
      - name: Check classified routes and parameters
        run: go run ./tools/ari-contract
      - name: Test drift detection
        run: go test ./tools/ari-contract
      - name: Build standalone snapshots and external consumer
        run: go run ./tools/release-check
