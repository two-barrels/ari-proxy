name: Go

on:
  push:
    branches: [main, master, v6, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      ari_ref:
        description: ARI branch or commit to test while the sibling replacement exists
        default: codex/v6-modernization
        type: string

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.8']
    defaults:
      run:
        working-directory: ari-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          path: ari-proxy
          persist-credentials: false
      # Keep this fixed to the modernization branch, including for external PRs.
      # Publish/push ARI first. After replacing ../ari with a tag, remove this step.
      - uses: actions/checkout@v7
        with:
          repository: two-barrels/ari
          ref: ${{ inputs.ari_ref || 'codex/v6-modernization' }}
          path: ari
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            ari/go.sum
            ari-proxy/go.sum
      - name: Verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Build packages and examples
        run: |
          go build ./...
          go build ./_examples/bridge ./_examples/play ./_examples/record ./_examples/stasisStart
      - name: Race tests
        run: go test -race ./...
      - name: Vulnerability scan
        if: matrix.go == '1.26.8'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
